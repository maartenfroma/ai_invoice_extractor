services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: maart
      POSTGRES_PASSWORD: maart123
    ports:
      - "5433:5432"

  web:
    build: .
    depends_on:
      - postgres
    env_file:
      - .env
    image: factuuur_ai_piloot
    container_name: factuuur_ai_piloot
    ports:
      - "8503:8501"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
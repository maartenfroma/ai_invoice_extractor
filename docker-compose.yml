services:

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: invoices
      POSTGRES_USER: maart
      POSTGRES_PASSWORD: maart123
    ports:
      - "5433:5433"

  app:
    build: .
    depends_on:
      - postgres

  web:
    build: .
    image: ai_invoice_extractor
    container_name: ai_invoice_extractor
    ports:
      - "8501:8501"
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0  